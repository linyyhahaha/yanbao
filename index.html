<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和宝嘟200天纪念！</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #fcf2f5; /* 淡淡的粉色背景 */
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    /* ===== 拍立得照片墙 ===== */
    .photo-wall {
      position: absolute; width: 100%; height: 100%; z-index: 1;
    }

    .photo {
      position: absolute;
      background: #fff;
      padding: 8px 8px 25px 8px; /* 底部留白多一点，像拍立得 */
      border: 6px solid #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border-radius: 4px;
      width: 280px; /* 默认照片宽度，可根据需要微调 */
      transition: transform 0.3s ease, z-index 0.3s;
      cursor: pointer;
    }

    .photo img {
      width: 100%; height: 260px; object-fit: cover; display: block;
      border-radius: 2px;
    }

    .photo:hover {
      z-index: 10 !important;
      transform: scale(1.1) rotate(0deg) !important;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    /* 18张照片的散落位置与旋转角度 */
    /* 第一排 */
    .photo:nth-child(1) { top: -2%; left: 2%; transform: rotate(-5deg); z-index: 2; }
    .photo:nth-child(2) { top: -5%; left: 28%; transform: rotate(3deg); z-index: 1; }
    .photo:nth-child(3) { top: -3%; left: 55%; transform: rotate(-2deg); z-index: 3; }
    .photo:nth-child(4) { top: 0%; left: 82%; transform: rotate(6deg); z-index: 2; }

    /* 第二排 */
    .photo:nth-child(5) { top: 28%; left: -5%; transform: rotate(4deg); z-index: 2; }
    .photo:nth-child(6) { top: 25%; left: 22%; transform: rotate(-6deg); z-index: 1; }
    .photo:nth-child(7) { top: 30%; left: 48%; transform: rotate(2deg); z-index: 4; }
    .photo:nth-child(8) { top: 26%; left: 75%; transform: rotate(-3deg); z-index: 2; }

    /* 第三排 */
    .photo:nth-child(9) { top: 55%; left: 5%; transform: rotate(-3deg); z-index: 3; }
    .photo:nth-child(10) { top: 58%; left: 32%; transform: rotate(5deg); z-index: 2; }
    .photo:nth-child(11) { top: 52%; left: 60%; transform: rotate(-7deg); z-index: 1; }
    .photo:nth-child(12) { top: 56%; left: 85%; transform: rotate(4deg); z-index: 3; }

    /* 第四排 */
    .photo:nth-child(13) { top: 82%; left: -2%; transform: rotate(7deg); z-index: 1; }
    .photo:nth-child(14) { top: 85%; left: 25%; transform: rotate(-2deg); z-index: 2; }
    .photo:nth-child(15) { top: 80%; left: 50%; transform: rotate(4deg); z-index: 3; }
    .photo:nth-child(16) { top: 88%; left: 78%; transform: rotate(-5deg); z-index: 2; }
    
    /* 补充两张散落 */
    .photo:nth-child(17) { top: 15%; left: 42%; transform: rotate(8deg); z-index: 1; width: 240px; }
    .photo:nth-child(17) img { height: 220px; }
    .photo:nth-child(18) { top: 70%; left: 15%; transform: rotate(-8deg); z-index: 1; width: 240px; }
    .photo:nth-child(18) img { height: 220px; }

    /* 屏幕缩小适配（手机端） */
    @media (max-width: 768px) {
      .photo { width: 180px; }
      .photo img { height: 160px; }
      .photo:nth-child(17), .photo:nth-child(18) { width: 160px; }
      .photo:nth-child(17) img, .photo:nth-child(18) img { height: 140px; }
    }

    /* ===== 中间祝福卡片 ===== */
    .card-container {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(220, 50, 80, 0.15);
      border: 2px solid #fff;
      max-width: 90%;
    }

    .card-container h2 {
      color: #d6335f;
      font-size: 28px;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .card-container p {
      color: #555;
      font-size: 16px;
      line-height: 2;
      margin-bottom: 8px;
    }

    .heart { color: #d6335f; }
  </style>
</head>
<body>

  <!-- 18张散落照片 -->
  <div class="photo-wall">
    <div class="photo"><img src="photo1.jpg" alt=""></div>
    <div class="photo"><img src="photo2.jpg" alt=""></div>
    <div class="photo"><img src="photo3.jpg" alt=""></div>
    <div class="photo"><img src="photo4.jpg" alt=""></div>
    <div class="photo"><img src="photo5.jpg" alt=""></div>
    <div class="photo"><img src="photo6.jpg" alt=""></div>
    <div class="photo"><img src="photo7.jpg" alt=""></div>
    <div class="photo"><img src="photo8.jpg" alt=""></div>
    <div class="photo"><img src="photo9.jpg" alt=""></div>
    <div class="photo"><img src="photo10.jpg" alt=""></div>
    <div class="photo"><img src="photo11.jpg" alt=""></div>
    <div class="photo"><img src="photo12.jpg" alt=""></div>
    <div class="photo"><img src="photo13.jpg" alt=""></div>
    <div class="photo"><img src="photo14.jpg" alt=""></div>
    <div class="photo"><img src="photo15.jpg" alt=""></div>
    <div class="photo"><img src="photo16.jpg" alt=""></div>
    <div class="photo"><img src="photo17.jpg" alt=""></div>
    <div class="photo"><img src="photo18.jpg" alt=""></div>
  </div>

  <!-- 中间祝福卡片 -->
  <div class="card-container">
    <h2><span class="heart">❤️</span> 和宝嘟200天纪念！ <span class="heart">❤️</span></h2>
    <p>遇见你是我最幸运的事</p>
    <p>每一天有你的陪伴都很幸福</p>
    <p>我们在一起200天啦！</p>
    <p>愿我们的故事永远写不完 <span class="heart">❤️</span></p>
  </div>

</body>
</html>
