<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝七夕快乐</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #fff5f7; }
/* ===== 滚动图片区域 ===== */
.scroll-area { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: flex; overflow: hidden; }
.scroll-col { flex: 1; position: relative; will-change: transform; }
.scroll-col .img-card { position: absolute; left: 50%; width: 92%; background-size: cover; background-position: center; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.12); }
/* ===== 半透明遮罩 ===== */
.bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 245, 247, 0.35); z-index: 1; }
/* ===== 飘落爱心 ===== */
.hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: hidden; }
.heart { position: absolute; top: -10%; color: rgba(214, 51, 132, 0.45); animation: fall linear infinite; }
@keyframes fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
/* ===== 中央文字 ===== */
.content { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-align: center; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 45px 55px; border-radius: 24px; box-shadow: 0 12px 48px rgba(214, 51, 132, 0.15); border: 1px solid rgba(214, 51, 132, 0.1); width: 90%; max-width: 450px; }
/* === 重点修改：标题对齐 === */
.content h1 { font-size: 2.6rem; color: #d63384; margin-bottom: 18px; animation: glow 3s ease-in-out infinite alternate; display: flex; align-items: center; justify-content: center; }
.title-text { white-space: nowrap; margin: 0 8px; }
.content h1 .emoji { flex-shrink: 0; font-size: 1.2em; }
.content p { font-size: 1.15rem; line-height: 2.2; color: #8b3a62; opacity: 0; animation: fadeInUp 2s ease-out forwards; animation-delay: 0.8s; }
@keyframes glow { from { text-shadow: 0 2px 12px rgba(214,51,132,0.25); } to { text-shadow: 0 4px 24px rgba(214,51,132,0.55), 0 0 40px rgba(214,51,132,0.15); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
/* ===== 音乐按钮 ===== */
.music-btn { position: fixed; top: 20px; right: 20px; z-index: 100; width: 48px; height: 48px; border-radius: 50%; background: rgba(214,51,132,0.75); border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(214,51,132,0.4); transition: transform 0.3s; }
.music-btn:hover { transform: scale(1.1); }
.music-btn.playing { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* ===== 手机适配优化 ===== */
@media (max-width: 600px) {
  .content { padding: 30px 20px; width: 85%; border-radius: 18px; }
  .content h1 { font-size: 2rem; }
  .content p { font-size: 1rem; line-height: 1.8; }
}
</style>
</head>
<body>
<!-- 滚动图片区域 -->
<div class="scroll-area" id="scrollArea"></div>
<!-- 遮罩 -->
<div class="bg-overlay"></div>
<!-- 飘落爱心 -->
<div class="hearts" id="hearts"></div>
<!-- 中央文字 -->
<div class="content">
  <h1>
    <span class="emoji">💕</span>
    <span class="title-text">宝宝七夕快乐</span>
    <span class="emoji">💕</span>
  </h1>
  <p>
    遇见你是我最幸运的事<br>
    每一天有你的陪伴都很幸福<br>
    愿我们的故事永远写不完<br>
    七夕快乐，我爱你 ❤️
  </p>
</div>
<!-- 音乐 -->
<button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== 滚动图片配置 ===== */
var images = [
  'photo1.jpg', 'photo2.jpg', 'photo3.jpg', 'photo4.jpg',
  'photo5.jpg', 'photo6.jpg', 'photo7.jpg', 'photo8.jpg',
  'photo9.jpg', 'photo10.jpg', 'photo11.jpg', 'photo12.jpg',
  'photo13.jpg', 'photo14.jpg', 'photo15.jpg', 'photo16.jpg',
  'photo17.jpg', 'photo18.jpg'
];
var COL_COUNT = 4;
var IMG_HEIGHT = 280;
var OVERLAP = 90;
var ROTATIONS = [-4, -2, 0, 2, 4, -3, 1, 3, -1];

var scrollArea = document.getElementById('scrollArea');
var columns = [];
var colData = [];

for (var c = 0; c < COL_COUNT; c++) {
  var col = document.createElement('div');
  col.className = 'scroll-col';
  scrollArea.appendChild(col);
  columns.push(col);
  colData.push({ offset: 0, speed: 0.4 + Math.random() * 0.5, setHeight: 0 });
}

var colImages = [];
for (var c = 0; c < COL_COUNT; c++) colImages.push([]);
for (var i = 0; i < images.length; i++) {
  colImages[i % COL_COUNT].push(images[i]);
}
for (var c = 0; c < COL_COUNT; c++) {
  while (colImages[c].length < 4) {
    colImages[c] = colImages[c].concat(colImages[c]);
  }
}

for (var c = 0; c < COL_COUNT; c++) {
  var col = columns[c];
  var imgs = colImages[c];
  var y = 0;
  for (var i = 0; i < imgs.length; i++) {
    var card = document.createElement('div');
    card.className = 'img-card';
    card.style.top = y + 'px';
    card.style.height = IMG_HEIGHT + 'px';
    card.style.backgroundImage = "url('" + imgs[i] + "')";
    card.style.transform = 'translateX(-50%) rotate(' + ROTATIONS[i % ROTATIONS.length] + 'deg)';
    col.appendChild(card);
    y += IMG_HEIGHT - OVERLAP;
  }
  for (var i = 0; i < imgs.length; i++) {
    var card = document.createElement('div');
    card.className = 'img-card';
    card.style.top = y + 'px';
    card.style.height = IMG_HEIGHT + 'px';
    card.style.backgroundImage = "url('" + imgs[i] + "')";
    card.style.transform = 'translateX(-50%) rotate(' + ROTATIONS[i % ROTATIONS.length] + 'deg)';
    col.appendChild(card);
    y += IMG_HEIGHT - OVERLAP;
  }
  colData[c].setHeight = y / 2;
}

function animate() {
  for (var c = 0; c < COL_COUNT; c++) {
    colData[c].offset += colData[c].speed;
    if (colData[c].offset >= colData[c].setHeight) {
      colData[c].offset -= colData[c].setHeight;
    }
    columns[c].style.transform = 'translateY(' + (-colData[c].offset) + 'px)';
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ===== 飘落爱心 ===== */
(function() {
  var container = document.getElementById('hearts');
  var symbols = ['❤', '💕', '✨', '💗'];
  for (var i = 0; i < 20; i++) {
    var heart = document.createElement('span');
    heart.className = 'heart';
    heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    heart.style.left = Math.random() * 100 + '%';
    heart.style.fontSize = (12 + Math.random() * 18) + 'px';
    heart.style.animationDuration = (5 + Math.random() * 8) + 's';
    heart.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(heart);
  }
})();

/* ===== 音乐控制 ===== */
var music = document.getElementById('bgMusic');
var btn = document.getElementById('musicBtn');
var isPlaying = false;

function toggleMusic() {
    if (isPlaying) {
        music.pause();
        btn.textContent = '🎵';
        btn.classList.remove('playing');
    } else {
        music.play().then(() => {
            btn.textContent = '🎶';
            btn.classList.add('playing');
        }).catch(err => {
            console.log('播放被阻止:', err);
            alert('请点击右上角的音乐按钮开启声音');
        });
    }
    isPlaying = !isPlaying;
}
</script>
</body>
</html>
