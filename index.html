<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝七夕快乐</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #fff5f7; }

/* ===== 滚动图片区域 ===== */
.scroll-area { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: flex; overflow: hidden; }
.scroll-col { flex: 1; position: relative; will-change: transform; }
.scroll-col .img-card {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    background-size: cover;
    background-position: center;
}

/* ===== 半透明遮罩 ===== */
.bg-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(255,240,243,0.5) 0%, rgba(255,240,243,0.85) 100%);
    z-index: 1; pointer-events: none;
}

/* ===== 音乐按钮 ===== */
#musicBtn {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: 2px solid #ff6b9d;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(255,107,157,0.3);
    transition: transform 0.3s;
}
#musicBtn.playing { animation: spin 3s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ===== 文字区域 ===== */
.text-area {
    position: fixed; bottom: 40px; left: 0; width: 100%;
    text-align: center; z-index: 10;
}
.text-area h1 {
    font-size: 28px; color: #ff4d7a;
    text-shadow: 0 2px 8px rgba(255,77,122,0.3);
    margin-bottom: 8px;
}
.text-area p {
    font-size: 16px; color: #ff85a2;
}
</style>
</head>
<body>

<!-- 滚动图片墙 -->
<div class="scroll-area" id="scrollArea"></div>

<!-- 遮罩 -->
<div class="bg-overlay"></div>

<!-- 音乐按钮 -->
<button id="musicBtn">🎵</button>

<!-- 文字 -->
<div class="text-area">
    <h1>宝宝七夕快乐 💕</h1>
    <p>和你在一起的每一天，都是情人节</p>
</div>

<audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== 照片数据 ===== */
const photos = [
    'photo1.jpg', 'photo2.jpg', 'photo3.jpg',
    'photo4.jpg', 'photo5.jpg', 'photo6.jpg'
];

/* ===== 生成滚动图片墙 ===== */
const scrollArea = document.getElementById('scrollArea');
const colCount = Math.min(photos.length, 3); // 最多3列
const cols = [];

for (let i = 0; i < colCount; i++) {
    const col = document.createElement('div');
    col.className = 'scroll-col';
    scrollArea.appendChild(col);
    cols.push(col);
}

photos.forEach((src, index) => {
    const card = document.createElement('div');
    card.className = 'img-card';
    card.style.backgroundImage = `url('${src}')`;
    const col = cols[index % colCount];
    const top = Math.floor(index / colCount) * 105 + '%';
    card.style.top = top;
    card.style.height = '45%';
    col.appendChild(card);
});

/* ===== 滚动动画 ===== */
function startScroll() {
    const colHeights = cols.map(col => col.scrollHeight);
    const speeds = [0.6, -0.4, 0.5]; // 不同方向、不同速度

    cols.forEach((col, i) => {
        let pos = 0;
        function animate() {
            pos += speeds[i];
            const h = col.scrollHeight;
            if (Math.abs(pos) >= h / 2) pos = 0;
            col.style.transform = `translateY(${pos}px)`;
            requestAnimationFrame(animate);
        }
        animate();
    });
}

setTimeout(startScroll, 800);

/* ===== 音乐控制 ===== */
var music = document.getElementById('bgMusic');
var btn = document.getElementById('musicBtn');
var isPlaying = false;

function toggleMusic() {
    if (isPlaying) {
        music.pause();
        btn.textContent = '🎵';
        btn.classList.remove('playing');
    } else {
        music.play().then(() => {
            btn.textContent = '🎶';
            btn.classList.add('playing');
        }).catch(err => {
            console.log('播放被阻止:', err);
            alert('请点击右上角按钮开启声音');
        });
    }
    isPlaying = !isPlaying;
}

btn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleMusic();
});
</script>

</body>
</html>
